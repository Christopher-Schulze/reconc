# Legacy harness prune-policy compatibility.
#
# Reconc accumulates per-session state under
# `~/.reconc/sessions/claude/projects/<sha256(repo)[:16]>/sessions/` plus a
# matching `reports/` and `command-proofs/` siblings. Product-owned retention
# now lives in the Reconc binary and runs from SessionStart/SessionEnd; Stop
# never prunes.
#
# Retention is COUNT-based for sessions/reports (so the budget is exact,
# independent of how often a vacation lasts), and SIZE+LINE-bounded for the
# JSONL log (whichever stricter applies).
#
# This file remains only for older bootstraps that still invoke the nested Go
# utility. New repos and agents use `reconc prune . [--dry-run] [--json]`.

sessions_retention: 32
reports_retention: 32
command_proofs_retention: 64
audit_jsonl_max_bytes: 2097152     # 2 MiB compatibility ceiling
audit_jsonl_max_lines: 5000
prune_interval_seconds: 21600      # 6 hours
