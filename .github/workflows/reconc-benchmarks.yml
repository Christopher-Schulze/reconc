name: Calibrated Benchmarks

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/benchmarks/**'
      - '.github/workflows/reconc-benchmarks.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    name: Record and compare
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Resolve checked baseline source
        id: baseline
        run: |
          commit=$(go run ./scripts/benchmarks/history baseline-commit --baseline scripts/benchmarks/baseline.json)
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Check out exact baseline source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.baseline.outputs.commit }}
          path: .build/benchmark-baseline
          persist-credentials: false
          fetch-depth: 1

      - name: Record baseline on this runner
        run: go run ./scripts/benchmarks/history record --root .build/benchmark-baseline --output .build/benchmarks/runner-result.json

      - name: Preserve checked source and tolerances in runner baseline
        run: go run ./scripts/benchmarks/history baseline --reference scripts/benchmarks/baseline.json --result .build/benchmarks/runner-result.json --output .build/benchmarks/runner-baseline.json --refresh

      - name: Record calibrated benchmarks and bounded profiles
        run: make benchmark-profile BENCHMARK_PROFILE_DIR=.build/benchmarks/profiles

      - name: Compare with source-bound runner baseline
        run: make benchmark-compare BENCHMARK_BASELINE=.build/benchmarks/runner-baseline.json

      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reconc-benchmark-${{ github.run_id }}
          path: .build/benchmarks/
          if-no-files-found: warn
          retention-days: 30
