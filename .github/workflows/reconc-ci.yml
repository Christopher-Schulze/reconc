name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_smoke:
        description: Run optional Windows filesystem and CLI smoke checks (two-minute job limit)
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  BUN_INTEGRITY: sha512-aB6GVd42x1Y5ie1K16SF+oLGtgSkwX9hgoDdIW88pjvfTccU8F1vfpoOt34QLv0dZ1v3XimtaxPlZUG81Gx9Zg==
  TEST_PARALLELISM: 4

jobs:
  # Linux validation runs as three parallel jobs: one complete pass of the
  # suite per job instead of two sequential passes in one job.
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Audit public/private boundary
        run: make publication-audit

      - name: Check formatting
        run: make fmt-check

      - name: Check module tidy
        run: |
          go mod tidy -diff
          (cd harness/template && go mod tidy -diff)

      - name: Vet
        run: |
          go vet ./...
          (cd harness/template && go vet ./...)

      - name: Vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          (cd harness/template && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)

      - name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          (cd harness/template && go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...)

  race:
    name: Go checks (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          bun_package_dir="$(mktemp -d)"
          trap 'rm -rf "$bun_package_dir"' EXIT
          npm pack "bun@$BUN_VERSION" --pack-destination "$bun_package_dir" --json > "$bun_package_dir/pack.json"
          actual_bun_integrity="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data[0].integrity)' "$bun_package_dir/pack.json")"
          test "$actual_bun_integrity" = "$BUN_INTEGRITY"
          npm install --global "$bun_package_dir/bun-$BUN_VERSION.tgz"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Race tests
        run: |
          go test -p="$TEST_PARALLELISM" -race -count=1 ./...
          (cd harness/template && go test -p="$TEST_PARALLELISM" -race -count=1 ./...)

  coverage:
    name: Coverage and self-hosting (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          bun_package_dir="$(mktemp -d)"
          trap 'rm -rf "$bun_package_dir"' EXIT
          npm pack "bun@$BUN_VERSION" --pack-destination "$bun_package_dir" --json > "$bun_package_dir/pack.json"
          actual_bun_integrity="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data[0].integrity)' "$bun_package_dir/pack.json")"
          test "$actual_bun_integrity" = "$BUN_INTEGRITY"
          npm install --global "$bun_package_dir/bun-$BUN_VERSION.tgz"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Measure coverage
        run: make coverage

      - name: Self-hosting golden path
        run: make self-host

  macos:
    name: Go checks (macos-15)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          bun_package_dir="$(mktemp -d)"
          trap 'rm -rf "$bun_package_dir"' EXIT
          npm pack "bun@$BUN_VERSION" --pack-destination "$bun_package_dir" --json > "$bun_package_dir/pack.json"
          actual_bun_integrity="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data[0].integrity)' "$bun_package_dir/pack.json")"
          test "$actual_bun_integrity" = "$BUN_INTEGRITY"
          npm install --global "$bun_package_dir/bun-$BUN_VERSION.tgz"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Test
        run: |
          go test -p="$TEST_PARALLELISM" -count=1 ./...
          (cd harness/template && go test -p="$TEST_PARALLELISM" -count=1 ./...)

      - name: Self-hosting golden path
        run: make self-host

  windows-runtime:
    name: Windows build and smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_smoke }}
    runs-on: windows-2025
    timeout-minutes: 2
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Windows runtime preflight
        run: ./scripts/tests/windows-runtime-preflight.sh

      - name: Build and smoke CLI
        run: |
          version="$(./scripts/build/resolve-version.sh)"
          make release-one TARGET=windows/amd64
          artifact="dist/reconc-$version-windows-amd64.exe"
          "$artifact" --version
          "$artifact" --help >/dev/null

  langchain-integration:
    name: LangChain MCP interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PIP_ONLY_BINARY: ":all:"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.14
          check-latest: false

      - name: Install pinned external consumer
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.13.14"
          python -m pip install --require-hashes -r scripts/tests/langchain-requirements.lock

      - name: Prove LangChain MCP interoperability
        run: make test-langchain PYTHON=python

  release-trust:
    name: Release trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Verify release and installer failure paths
        run: ./scripts/tests/release-trust.sh
