name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          npm install --global bun@1.3.14
          test "$(bun --version)" = "1.3.14"

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Audit public/private boundary
        run: make publication-audit

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || {
            printf 'Go files require gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          }

      - name: Check module tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy -diff
          (cd harness/template && go mod tidy -diff)

      - name: Test
        run: |
          go test ./...
          (cd harness/template && go test ./...)

      - name: Self-hosting golden path
        if: runner.os != 'Windows'
        run: make self-host

      - name: Vet
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          (cd harness/template && go vet ./...)

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          (cd harness/template && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)

      - name: Staticcheck
        if: runner.os == 'Linux'
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          (cd harness/template && go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...)

      - name: Race tests
        if: runner.os == 'Linux'
        run: |
          go test -race -count=1 ./...
          (cd harness/template && go test -race -count=1 ./...)

  windows-runtime:
    name: Windows build and smoke
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          npm install --global bun@1.3.14
          test "$(bun --version)" = "1.3.14"

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Audit public/private boundary
        run: make publication-audit

      - name: Test
        run: |
          go test ./...
          (cd harness/template && go test ./...)

      - name: Build and smoke CLI
        run: |
          go build -trimpath -o reconc.exe ./cmd/reconc
          ./reconc.exe --version
          ./reconc.exe --help >/dev/null

  release-trust:
    name: Release trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Verify release and installer failure paths
        run: ./scripts/tests/release-trust.sh
