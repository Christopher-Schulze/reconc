name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos_checks:
        description: Run the complete macOS test and self-hosting checks
        required: false
        default: false
        type: boolean
      windows_smoke:
        description: Run optional Windows filesystem and CLI smoke checks (two-minute job limit)
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  BUN_INTEGRITY: sha512-aB6GVd42x1Y5ie1K16SF+oLGtgSkwX9hgoDdIW88pjvfTccU8F1vfpoOt34QLv0dZ1v3XimtaxPlZUG81Gx9Zg==
  TEST_PARALLELISM: 4

jobs:
  # Every commit runs the boundary checks and Linux tests with self-hosting.
  # Manual dispatch can also select the shared macOS checks. Release requires
  # those macOS checks separately, alongside its race, analysis, and trust gates.
  checks:
    name: Boundary checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Audit public/private boundary
        run: make publication-audit

      - name: Check formatting
        run: make fmt-check

      - name: Check module tidy
        run: |
          go mod tidy -diff
          (cd harness/template && go mod tidy -diff)

  linux:
    name: Go checks (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          bun_package_dir="$(mktemp -d)"
          trap 'rm -rf "$bun_package_dir"' EXIT
          npm pack "bun@$BUN_VERSION" --pack-destination "$bun_package_dir" --json > "$bun_package_dir/pack.json"
          actual_bun_integrity="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data[0].integrity)' "$bun_package_dir/pack.json")"
          test "$actual_bun_integrity" = "$BUN_INTEGRITY"
          npm install --global "$bun_package_dir/bun-$BUN_VERSION.tgz"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Test
        run: ./scripts/tests/go-test-shard.sh 1 1 -p="$TEST_PARALLELISM" -vet=off -count=1

      - name: Self-hosting golden path
        run: make self-host

  macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_checks }}
    uses: ./.github/workflows/reconc-macos.yml

  windows-runtime:
    name: Windows build and smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_smoke }}
    runs-on: windows-2025
    timeout-minutes: 2
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Windows runtime preflight
        run: ./scripts/tests/windows-runtime-preflight.sh

      - name: Build and smoke CLI
        run: |
          version="$(./scripts/build/resolve-version.sh)"
          make release-one TARGET=windows/amd64
          artifact="dist/reconc-$version-windows-amd64.exe"
          "$artifact" --version
          "$artifact" --help >/dev/null

  result:
    name: CI result
    if: ${{ always() }}
    needs: [checks, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require selected CI jobs
        env:
          REQUIRED_RESULTS: ${{ needs.checks.result }} ${{ needs.linux.result }}
          MACOS_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_checks }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          for result in $REQUIRED_RESULTS; do
            if [ "$result" != success ]; then
              printf 'A required CI job ended with %s.\n' "$result" >&2
              exit 1
            fi
          done
          if [ "$MACOS_REQUIRED" = true ]; then
            if [ "$MACOS_RESULT" != success ]; then
              printf 'Requested macOS checks ended with %s.\n' "$MACOS_RESULT" >&2
              exit 1
            fi
          elif [ "$MACOS_RESULT" != skipped ]; then
            printf 'Unrequested macOS checks ended with %s.\n' "$MACOS_RESULT" >&2
            exit 1
          fi
