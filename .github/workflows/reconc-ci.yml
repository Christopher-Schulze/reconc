name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || {
            printf 'Go files require gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          }

      - name: Check module tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy -diff
          (cd harness/template && go mod tidy -diff)

      - name: Test
        run: |
          go test ./...
          (cd harness/template && go test ./...)

      - name: Self-hosting golden path
        if: runner.os != 'Windows'
        run: make self-host

      - name: Vet
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          (cd harness/template && go vet ./...)

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          (cd harness/template && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)

      - name: Staticcheck
        if: runner.os == 'Linux'
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          (cd harness/template && go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...)

      - name: Race tests
        if: runner.os == 'Linux'
        run: |
          go test -race -count=1 ./...
          (cd harness/template && go test -race -count=1 ./...)

  windows-runtime:
    name: Windows build and smoke
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Test
        run: |
          go test ./...
          (cd harness/template && go test ./...)

      - name: Build and smoke CLI
        run: |
          go build -trimpath -o reconc.exe ./cmd/reconc
          ./reconc.exe --version
          ./reconc.exe --help >/dev/null

  release-trust:
    name: Release trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify release and installer failure paths
        run: ./scripts/tests/release-trust.sh
