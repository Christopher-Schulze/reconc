name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_release:
        description: Verify the published Windows release over HTTPS
        required: false
        default: false
        type: boolean
      full_windows:
        description: Run the slow all-package Windows suite in addition to preflight, build, and installer checks
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  BUN_INTEGRITY: sha512-aB6GVd42x1Y5ie1K16SF+oLGtgSkwX9hgoDdIW88pjvfTccU8F1vfpoOt34QLv0dZ1v3XimtaxPlZUG81Gx9Zg==
  TEST_PARALLELISM: 4

jobs:
  test:
    name: Go checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          bun_package_dir="$(mktemp -d)"
          trap 'rm -rf "$bun_package_dir"' EXIT
          npm pack "bun@$BUN_VERSION" --pack-destination "$bun_package_dir" --json > "$bun_package_dir/pack.json"
          actual_bun_integrity="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data[0].integrity)' "$bun_package_dir/pack.json")"
          test "$actual_bun_integrity" = "$BUN_INTEGRITY"
          npm install --global "$bun_package_dir/bun-$BUN_VERSION.tgz"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Audit public/private boundary
        if: runner.os == 'Linux'
        run: make publication-audit

      - name: Check formatting
        if: runner.os == 'Linux'
        run: make fmt-check

      - name: Check module tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy -diff
          (cd harness/template && go mod tidy -diff)

      - name: Test
        if: runner.os != 'Linux'
        run: |
          go test -p="$TEST_PARALLELISM" -count=1 ./...
          (cd harness/template && go test -p="$TEST_PARALLELISM" -count=1 ./...)

      - name: Measure coverage
        if: runner.os == 'Linux'
        run: make coverage

      - name: Self-hosting golden path
        if: runner.os != 'Windows'
        run: make self-host

      - name: Vet
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          (cd harness/template && go vet ./...)

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          (cd harness/template && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)

      - name: Staticcheck
        if: runner.os == 'Linux'
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          (cd harness/template && go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...)

      - name: Race tests
        if: runner.os == 'Linux'
        run: |
          go test -p="$TEST_PARALLELISM" -race -count=1 ./...
          (cd harness/template && go test -p="$TEST_PARALLELISM" -race -count=1 ./...)

  windows-runtime:
    name: Windows build and smoke
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      FULL_WINDOWS_SUITE: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && inputs.full_windows) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Windows runtime preflight
        timeout-minutes: 4
        run: ./scripts/tests/windows-runtime-preflight.sh

      - name: Set up Node
        if: env.FULL_WINDOWS_SUITE == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        if: env.FULL_WINDOWS_SUITE == 'true'
        run: |
          bun_package_dir="$(mktemp -d)"
          trap 'rm -rf "$bun_package_dir"' EXIT
          npm pack "bun@$BUN_VERSION" --pack-destination "$bun_package_dir" --json > "$bun_package_dir/pack.json"
          actual_bun_integrity="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data[0].integrity)' "$bun_package_dir/pack.json")"
          test "$actual_bun_integrity" = "$BUN_INTEGRITY"
          npm install --global "$bun_package_dir/bun-$BUN_VERSION.tgz"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Test full Windows suite
        if: env.FULL_WINDOWS_SUITE == 'true'
        run: |
          go test -p=2 -count=1 ./...
          (cd harness/template && go test -p=2 -count=1 ./...)

      - name: Build and smoke CLI
        run: |
          version="$(sed -n 's/^var Version = "\([^"]*\)"$/\1/p' cmd/reconc/main.go)"
          test -n "$version"
          make release-one TARGET=windows/amd64 VERSION="$version"
          artifact="dist/reconc-$version-windows-amd64.exe"
          "$artifact" --version
          "$artifact" --help >/dev/null

      - name: Test native Windows installer
        shell: pwsh
        env:
          RECONC_LIVE_RELEASE: ${{ inputs.live_release || 'false' }}
        run: |
          $version = (Select-String -Path cmd/reconc/main.go -Pattern '^var Version = "([^"]+)"$').Matches.Groups[1].Value
          $liveRelease = [Convert]::ToBoolean($env:RECONC_LIVE_RELEASE)
          ./scripts/tests/test-windows-installer.ps1 `
            -InstallerPath ./install.ps1 `
            -BinaryPath "./dist/reconc-$version-windows-amd64.exe" `
            -ExpectedVersion $version `
            -LiveRelease $liveRelease

  langchain-integration:
    name: LangChain MCP interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PIP_ONLY_BINARY: ":all:"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.14
          check-latest: false

      - name: Install pinned external consumer
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.13.14"
          python -m pip install --require-hashes -r scripts/tests/langchain-requirements.lock

      - name: Prove LangChain MCP interoperability
        run: make test-langchain PYTHON=python

  release-trust:
    name: Release trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Verify release and installer failure paths
        run: ./scripts/tests/release-trust.sh
