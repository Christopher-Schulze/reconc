name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -type f -name '*.go' -not -path './.git/*'))"

      - name: Check module tidy
        run: |
          go mod tidy -diff
          (cd harness/template && go mod tidy -diff)

      - name: Test
        run: |
          go test ./...
          (cd harness/template && go test ./...)

      - name: Vet
        run: |
          go vet ./...
          (cd harness/template && go vet ./...)

      - name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          (cd harness/template && go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...)

      - name: Race tests
        run: |
          go test -race -count=1 ./...
          (cd harness/template && go test -race -count=1 ./...)

  release-trust:
    name: Release trust
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify release and installer failure paths
        run: ./scripts/tests/release-trust.sh
