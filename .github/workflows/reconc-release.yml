name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (reconc-vX.Y.Z)
        required: true
        type: string
      replace_published:
        description: Explicitly replace an already-published release for this tag
        required: false
        default: false
        type: boolean
      windows_smoke:
        description: Run optional Windows filesystem and CLI smoke checks (two-minute job limit)
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  attestations: write
  checks: read
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.tag }}
  BUN_VERSION: 1.3.14
  BUN_INTEGRITY: sha512-aB6GVd42x1Y5ie1K16SF+oLGtgSkwX9hgoDdIW88pjvfTccU8F1vfpoOt34QLv0dZ1v3XimtaxPlZUG81Gx9Zg==

jobs:
  windows-runtime:
    name: Windows build and smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_smoke }}
    runs-on: windows-2025
    timeout-minutes: 2
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Windows runtime preflight
        run: ./scripts/tests/windows-runtime-preflight.sh

      - name: Build and smoke CLI
        run: |
          version="$(./scripts/build/resolve-version.sh)"
          make release-one TARGET=windows/amd64
          artifact="dist/reconc-$version-windows-amd64.exe"
          "$artifact" --version
          "$artifact" --help >/dev/null

  # A wrong tag or ref, missing release notes, or a commit without green CI
  # fails here within seconds instead of after the long gate jobs.
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Verify selected tag and source identity
        run: ./scripts/release/verify-release-selection.sh

      - name: Require green CI and CodeQL for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/require-green-checks.sh "$(git rev-parse HEAD)"

  # Pre-release gate: the suites CI no longer runs on every commit run here
  # against the exact tag, before any artifact is built.
  gate-macos:
    name: Release gate macOS checks
    needs: [preflight]
    permissions:
      contents: read
    uses: ./.github/workflows/reconc-macos.yml

  gate-static:
    name: Release gate static checks
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Vet
        run: |
          go vet ./...
          (cd harness/template && go vet ./...)

      - name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          (cd harness/template && go run honnef.co/go/tools/cmd/staticcheck@latest ./...)

  gate-race:
    name: Release gate race tests (${{ matrix.shard }}/3)
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    env:
      TEST_PARALLELISM: 4
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          bun_package_dir="$(mktemp -d)"
          trap 'rm -rf "$bun_package_dir"' EXIT
          npm pack "bun@$BUN_VERSION" --pack-destination "$bun_package_dir" --json > "$bun_package_dir/pack.json"
          actual_bun_integrity="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data[0].integrity)' "$bun_package_dir/pack.json")"
          test "$actual_bun_integrity" = "$BUN_INTEGRITY"
          npm install --global "$bun_package_dir/bun-$BUN_VERSION.tgz"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Race tests
        env:
          SHARD: ${{ matrix.shard }}
        run: ./scripts/tests/go-test-shard.sh "$SHARD" 3 -p="$TEST_PARALLELISM" -vet=off -race -count=1

  gate-trust:
    name: Release gate trust
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Verify release and installer failure paths
        run: ./scripts/tests/release-trust.sh

  release:
    name: Build release artifacts
    needs: [gate-macos, gate-static, gate-race, gate-trust]
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Verify selected tag and source identity
        run: ./scripts/release/verify-release-selection.sh

      - name: Verify immutable schema publication
        run: |
          verified=false
          for attempt in 1 2 3 4 5; do
            if go run ./scripts/release/schema-assets verify-published; then
              verified=true
              break
            fi
            [ "$attempt" -eq 5 ] || sleep 3
          done
          test "$verified" = true

      # Candidate CI and CodeQL cover this commit; the preceding release gates
      # add mandatory macOS checks, race tests, static analysis, and trust.
      - name: Require green CI and CodeQL for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/require-green-checks.sh "$(git rev-parse HEAD)"

      - name: Verify release-only gates
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          (cd harness/template && go run golang.org/x/vuln/cmd/govulncheck@latest ./...)
          go run ./scripts/build/legacy-hook-generators --check

      - name: Build artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          make release

      - name: Verify checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          make verify-release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPLACE_PUBLISHED: ${{ inputs.replace_published }}
        run: |
          case "$REPLACE_PUBLISHED" in
            true) publication_mode=replace ;;
            false) publication_mode=new ;;
            *) printf 'Invalid replacement input: %s\n' "$REPLACE_PUBLISHED" >&2; exit 1 ;;
          esac
          notes_file=".github/releases/${RELEASE_TAG}.md"
          ./scripts/release/publish-github-release.sh \
            "$RELEASE_TAG" dist "$notes_file" "$publication_mode"
