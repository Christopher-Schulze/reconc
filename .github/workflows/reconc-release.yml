name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (reconc-vX.Y.Z)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  BUN_VERSION: 1.3.14
  BUN_INTEGRITY: sha512-aB6GVd42x1Y5ie1K16SF+oLGtgSkwX9hgoDdIW88pjvfTccU8F1vfpoOt34QLv0dZ1v3XimtaxPlZUG81Gx9Zg==

jobs:
  release:
    name: Build release artifacts
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          bun_package_dir="$(mktemp -d)"
          trap 'rm -rf "$bun_package_dir"' EXIT
          npm pack "bun@$BUN_VERSION" --pack-destination "$bun_package_dir" --json > "$bun_package_dir/pack.json"
          actual_bun_integrity="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data[0].integrity)' "$bun_package_dir/pack.json")"
          test "$actual_bun_integrity" = "$BUN_INTEGRITY"
          npm install --global "$bun_package_dir/bun-$BUN_VERSION.tgz"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Verify tag and source version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^reconc-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Input %s is not a stable reconc release tag.\n' "$RELEASE_TAG" >&2
            exit 1
          }
          tag_version="${RELEASE_TAG#reconc-v}"
          source_version="$(sed -n 's/^var Version = "\([^"]*\)"/\1/p' cmd/reconc/main.go)"
          test "$tag_version" = "$source_version" || {
            printf 'Tag version %s does not match source version %s.\n' "$tag_version" "$source_version" >&2
            exit 1
          }
          test -f ".github/releases/${RELEASE_TAG}.md" || {
            printf 'Release notes are missing for %s.\n' "$RELEASE_TAG" >&2
            exit 1
          }

      - name: Verify source and release gates
        run: |
          make publication-audit
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || {
            printf 'Go files require gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          }
          go mod tidy -diff
          (cd harness/template && go mod tidy -diff)
          go test ./...
          (cd harness/template && go test ./...)
          go vet ./...
          (cd harness/template && go vet ./...)
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          (cd harness/template && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          (cd harness/template && go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...)
          go test -race -count=1 ./...
          (cd harness/template && go test -race -count=1 ./...)
          ./scripts/tests/release-trust.sh
          make self-host

      - name: Build artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#reconc-v}"
          make release VERSION="$version"

      - name: Verify checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#reconc-v}"
          ./scripts/release/verify-artifacts.sh dist reconc "$version" \
            darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          notes_file=".github/releases/${RELEASE_TAG}.md"
          release_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ -z "$release_state" ]; then
            gh release create "$RELEASE_TAG" \
              --title "reconc ${RELEASE_TAG#reconc-v}" \
              --notes-file "$notes_file" \
              --verify-tag \
              --draft
          elif [ "$release_state" != "true" ]; then
            printf 'Release %s is already published; nothing to replace.\n' "$RELEASE_TAG"
            exit 0
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
