name: Release

on:
  push:
    tags:
      - reconc-v*

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Verify source and release trust gates
        run: |
          go test ./...
          (cd harness/template && go test ./...)
          ./scripts/tests/release-trust.sh

      - name: Build artifacts
        run: |
          version="${GITHUB_REF_NAME#reconc-v}"
          make release VERSION="$version"

      - name: Verify checksums
        run: |
          version="${GITHUB_REF_NAME#reconc-v}"
          ./scripts/release/verify-artifacts.sh dist reconc "$version" \
            darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes_file=".github/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes_file" \
              --verify-tag \
              --draft
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag \
              --draft
          fi
          while read -r checksum asset extra; do
            [ -n "$checksum" ] || continue
            [ -n "$asset" ] && [ -z "${extra:-}" ]
            gh release upload "$GITHUB_REF_NAME" "dist/${asset#\*}"
          done < dist/SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false
