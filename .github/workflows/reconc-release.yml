name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (reconc-vX.Y.Z)
        required: true
        type: string
      replace_published:
        description: Explicitly replace an already-published release for this tag
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  BUN_VERSION: 1.3.14
  BUN_INTEGRITY: sha512-aB6GVd42x1Y5ie1K16SF+oLGtgSkwX9hgoDdIW88pjvfTccU8F1vfpoOt34QLv0dZ1v3XimtaxPlZUG81Gx9Zg==

jobs:
  windows-runtime:
    name: Native Windows release gate
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          bun_package_dir="$(mktemp -d)"
          trap 'rm -rf "$bun_package_dir"' EXIT
          npm pack "bun@$BUN_VERSION" --pack-destination "$bun_package_dir" --json > "$bun_package_dir/pack.json"
          actual_bun_integrity="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data[0].integrity)' "$bun_package_dir/pack.json")"
          test "$actual_bun_integrity" = "$BUN_INTEGRITY"
          npm install --global "$bun_package_dir/bun-$BUN_VERSION.tgz"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Download modules
        run: |
          go mod download
          (cd harness/template && go mod download)

      - name: Test natively
        run: |
          go test ./...
          (cd harness/template && go test ./...)

      - name: Build and smoke CLI
        run: |
          version="$(sed -n 's/^var Version = "\([^"]*\)"$/\1/p' cmd/reconc/main.go)"
          test -n "$version"
          make release-one TARGET=windows/amd64 VERSION="$version"
          artifact="dist/reconc-$version-windows-amd64.exe"
          "$artifact" --version
          "$artifact" --help >/dev/null

      - name: Test native Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path cmd/reconc/main.go -Pattern '^var Version = "([^"]+)"$').Matches.Groups[1].Value
          ./scripts/tests/test-windows-installer.ps1 `
            -InstallerPath ./install.ps1 `
            -BinaryPath "./dist/reconc-$version-windows-amd64.exe" `
            -ExpectedVersion $version

  langchain-runtime:
    name: LangChain MCP release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PIP_ONLY_BINARY: ":all:"
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.14
          check-latest: false

      - name: Install pinned external consumer
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.13.14"
          python -m pip install --require-hashes -r scripts/tests/langchain-requirements.lock

      - name: Prove LangChain MCP interoperability
        run: make test-langchain PYTHON=python

  release:
    name: Build release artifacts
    needs: [windows-runtime, langchain-runtime]
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Set up Bun
        run: |
          bun_package_dir="$(mktemp -d)"
          trap 'rm -rf "$bun_package_dir"' EXIT
          npm pack "bun@$BUN_VERSION" --pack-destination "$bun_package_dir" --json > "$bun_package_dir/pack.json"
          actual_bun_integrity="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(data[0].integrity)' "$bun_package_dir/pack.json")"
          test "$actual_bun_integrity" = "$BUN_INTEGRITY"
          npm install --global "$bun_package_dir/bun-$BUN_VERSION.tgz"
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Verify tag and source version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^reconc-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Input %s is not a stable reconc release tag.\n' "$RELEASE_TAG" >&2
            exit 1
          }
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || {
            printf 'Release workflow must run from refs/tags/%s, not %s.\n' "$RELEASE_TAG" "$GITHUB_REF" >&2
            exit 1
          }
          tag_version="${RELEASE_TAG#reconc-v}"
          source_version="$(sed -n 's/^var Version = "\([^"]*\)"/\1/p' cmd/reconc/main.go)"
          test "$tag_version" = "$source_version" || {
            printf 'Tag version %s does not match source version %s.\n' "$tag_version" "$source_version" >&2
            exit 1
          }
          test -f ".github/releases/${RELEASE_TAG}.md" || {
            printf 'Release notes are missing for %s.\n' "$RELEASE_TAG" >&2
            exit 1
          }

      - name: Verify immutable schema publication
        run: |
          verified=false
          for attempt in 1 2 3 4 5; do
            if go run ./scripts/release/schema-assets verify-published; then
              verified=true
              break
            fi
            [ "$attempt" -eq 5 ] || sleep 3
          done
          test "$verified" = true

      - name: Verify source and release gates
        run: |
          make fmt-check
          go mod tidy -diff
          (cd harness/template && go mod tidy -diff)
          go vet ./...
          (cd harness/template && go vet ./...)
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          (cd harness/template && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.0 ./...
          (cd harness/template && go run honnef.co/go/tools/cmd/staticcheck@v0.8.0 ./...)
          go test -race -count=1 ./...
          (cd harness/template && go test -race -count=1 ./...)
          ./scripts/tests/release-trust.sh
          make self-host

      - name: Build artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#reconc-v}"
          make release VERSION="$version"

      - name: Verify checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#reconc-v}"
          make verify-release VERSION="$version"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPLACE_PUBLISHED: ${{ inputs.replace_published }}
        run: |
          case "$REPLACE_PUBLISHED" in
            true) publication_mode=replace ;;
            false) publication_mode=new ;;
            *) printf 'Invalid replacement input: %s\n' "$REPLACE_PUBLISHED" >&2; exit 1 ;;
          esac
          notes_file=".github/releases/${RELEASE_TAG}.md"
          ./scripts/release/publish-github-release.sh \
            "$RELEASE_TAG" dist "$notes_file" "$publication_mode"
