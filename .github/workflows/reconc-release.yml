name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (reconc-vX.Y.Z)
        required: true
        type: string
      replace_published:
        description: Explicitly replace an already-published release for this tag
        required: false
        default: false
        type: boolean
      windows_smoke:
        description: Run optional Windows filesystem and CLI smoke checks (two-minute job limit)
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  attestations: write
  checks: read
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  windows-runtime:
    name: Windows build and smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_smoke }}
    runs-on: windows-2025
    timeout-minutes: 2
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Windows runtime preflight
        run: ./scripts/tests/windows-runtime-preflight.sh

      - name: Build and smoke CLI
        run: |
          version="$(./scripts/build/resolve-version.sh)"
          make release-one TARGET=windows/amd64
          artifact="dist/reconc-$version-windows-amd64.exe"
          "$artifact" --version
          "$artifact" --help >/dev/null

  release:
    name: Build release artifacts
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            harness/template/go.sum

      - name: Verify selected tag and source identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^reconc-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Input %s is not a stable reconc release tag.\n' "$RELEASE_TAG" >&2
            exit 1
          }
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || {
            printf 'Release workflow must run from refs/tags/%s, not %s.\n' "$RELEASE_TAG" "$GITHUB_REF" >&2
            exit 1
          }
          ./scripts/build/resolve-version.sh
          test -f ".github/releases/${RELEASE_TAG}.md" || {
            printf 'Release notes are missing for %s.\n' "$RELEASE_TAG" >&2
            exit 1
          }

      - name: Verify immutable schema publication
        run: |
          verified=false
          for attempt in 1 2 3 4 5; do
            if go run ./scripts/release/schema-assets verify-published; then
              verified=true
              break
            fi
            [ "$attempt" -eq 5 ] || sleep 3
          done
          test "$verified" = true

      # CI and CodeQL already ran every suite on this exact commit; the
      # release requires their success instead of repeating them and runs
      # only the checks that depend on release time or release tags.
      - name: Require green CI and CodeQL for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/require-green-checks.sh "$(git rev-parse HEAD)"

      - name: Verify release-only gates
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          (cd harness/template && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...)
          go run ./scripts/build/legacy-hook-generators --check

      - name: Build artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          make release

      - name: Verify checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          make verify-release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPLACE_PUBLISHED: ${{ inputs.replace_published }}
        run: |
          case "$REPLACE_PUBLISHED" in
            true) publication_mode=replace ;;
            false) publication_mode=new ;;
            *) printf 'Invalid replacement input: %s\n' "$REPLACE_PUBLISHED" >&2; exit 1 ;;
          esac
          notes_file=".github/releases/${RELEASE_TAG}.md"
          ./scripts/release/publish-github-release.sh \
            "$RELEASE_TAG" dist "$notes_file" "$publication_mode"
