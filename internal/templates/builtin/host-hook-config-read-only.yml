description: "Deny agent writes to installed Reconc hook artifacts, the binaries the hook wrapper runs, and the host settings that can disable them."
kind: deny_write
mode: block
message: "Reconc hook artifacts and the host settings that can switch them off are operator-owned; change them with `reconc hook install` or outside the agent session."
paths:
  - ".git/hooks/pre-commit"
  - ".githooks/pre-commit"
  - "tools/reconc/bin/hook"
  - "tools/reconc/bin/hook-target"
  - "tools/reconc/.build/bin/reconc"
  - ".build/bin/reconc"
  - "reconc"
  - "tools/reconc/dist/**"
  - "dist/reconc-*"
  - ".claude/settings.json"
  - ".claude/settings.local.json"
  - ".codex/hooks.json"
  - ".codex/config.toml"
  - ".github/hooks/reconc.json"
  - ".github/copilot/settings.json"
  - ".github/copilot/settings.local.json"
  - ".cursor/hooks.json"
  - ".opencode/plugins/reconc.js"
  - ".kilo/plugin/reconc.js"
  - ".devin/hooks.v1.json"
  - ".agents/hooks.json"
  - ".grok/hooks/reconc.json"
  - ".omp/extensions/reconc.ts"
  - ".omp/config.yml"
  - ".omp/settings.json"
  - ".pi/extensions/reconc.ts"
  - ".dsh/reconc.mjs"
  - ".dsh/reconc.patch.yml"
  - ".zcode/config.json"
