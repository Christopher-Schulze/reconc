description: "Legacy CI acknowledgment: warn when matching writes lack a self-reported 'ci-green' claim. Does not verify CI or block merges."
kind: require_claim
mode: warn
message: "Missing self-reported ci-green acknowledgment. This warning does not verify a CI run, its result, or the merge candidate."
claims:
  - "ci-green"
# User must supply:
#   when_paths: write scope where the acknowledgment is checked (e.g. ['**'])
# Setting mode: block gates the claim only; it does not authenticate CI success.
