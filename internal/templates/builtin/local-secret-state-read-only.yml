description: "Deny agent writes to common local secret and database state."
kind: deny_write
mode: block
message: "Secrets and local database state must stay outside agent-authored repository changes."
paths:
  - ".env"
  - "**/.env"
  - ".env.*"
  - "**/.env.*"
  - "*.key"
  - "**/*.key"
  - "*.pem"
  - "**/*.pem"
  - "*.p12"
  - "**/*.p12"
  - "*.pfx"
  - "**/*.pfx"
  - "*.db"
  - "**/*.db"
  - "*.db-wal"
  - "**/*.db-wal"
  - "*.db-shm"
  - "**/*.db-shm"
  - "*.sqlite"
  - "**/*.sqlite"
  - "*.sqlite3"
  - "**/*.sqlite3"
