description: "Deny agent writes to local secret and database state while allowing named config templates."
kind: deny_write
mode: block
message: "Secret state and local database sidecars must stay outside agent-authored repository changes; named config templates are explicitly allowed."
paths:
  - ".env"
  - "**/.env"
  - ".env.*"
  - "**/.env.*"
  - "*.key"
  - "**/*.key"
  - "*.pem"
  - "**/*.pem"
  - "*.p12"
  - "**/*.p12"
  - "*.pfx"
  - "**/*.pfx"
  - "*.db"
  - "**/*.db"
  - "*.db-wal"
  - "**/*.db-wal"
  - "*.db-shm"
  - "**/*.db-shm"
  - "*.sqlite"
  - "**/*.sqlite"
  - "*.sqlite-wal"
  - "**/*.sqlite-wal"
  - "*.sqlite-shm"
  - "**/*.sqlite-shm"
  - "*.sqlite3"
  - "**/*.sqlite3"
  - "*.sqlite3-wal"
  - "**/*.sqlite3-wal"
  - "*.sqlite3-shm"
  - "**/*.sqlite3-shm"
exclude_paths:
  - ".env.example"
  - "**/.env.example"
  - ".env.template"
  - "**/.env.template"
