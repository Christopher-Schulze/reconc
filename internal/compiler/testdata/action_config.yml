actions:
  tools:
    - id: warehouse-query
      transport: mcp_stdio
      server_label: warehouse
      tool: query
      effect:
        kind: external
      ledger_name_safe: true
  defaults:
    declared_tool: warn
    cache: never
  rules:
    - id: block-production
      selector:
        tool_ids: [warehouse-query]
        phases: [pre_call]
      when:
        predicate:
          source: arguments
          pointer: /database
          op: eq
          value: production
      decision: block
      message: Production access is forbidden.
  approvals:
    - id: warehouse-summary
      selector:
        tool_ids: [warehouse-query]
        phases: [pre_call]
      selected_arguments: [/database]
  detectors:
    - id: inspect-database
      selector:
        tool_ids: [warehouse-query]
        phases: [pre_call]
      pack_id: reconc-core-v1
      pack_digest: sha256:0b4b8260995839139f2d0ba8521fc1d6f3d98744db854717364612fc626ed972
      fields:
        - source: arguments
          pointer: /database
      categories: [forbidden_data]
      forbidden_terms: [production]
  ledger:
    mode: best_effort
    tool_identity: exact_name
    selected_fields:
      - source: result
        pointer: /rows
      - source: arguments
        pointer: /database
