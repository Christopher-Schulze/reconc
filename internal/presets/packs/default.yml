# reconc preset: default
#
# Baseline guardrails most repos want. Blocks writes to generated output
# directories and warns when lockfile-generating manifests change without
# a matching install/sync command. Designed to be extended, not replaced.

pack:
  format_version: "1"
  name: default
  summary: Baseline generated-output protection and manifest synchronization.
  stacks: ["*"]
  capabilities:
    - id: generated-output-protection
      inputs: ["generated/**", "dist/**", "build/**"]
      evidence: ["write-path"]
      rules: ["preset-default-generated-read-only"]
    - id: dependency-manifest-sync
      inputs: ["package.json", "pyproject.toml", "Cargo.toml", "go.mod", "requirements.txt"]
      evidence: ["command"]
      rules: ["preset-default-lockfiles-follow-manifests"]
  conflicts: []

rules:
  - id: preset-default-generated-read-only
    kind: deny_write
    mode: block
    paths:
      # Top-level output directories.
      - "generated/**"
      - "dist/**"
      - "build/**"
      # Nested under any prefix - required for monorepos where each
      # package keeps its own dist/ or generated/ directory. Nested
      # build/ is intentionally not matched because scripts/build/ is
      # commonly source-owned tooling.
      - "**/generated/**"
      - "**/dist/**"
      # Files explicitly flagged as generated regardless of directory.
      - "**/*.generated.*"
    message: Generated artifacts are managed by the build; edit the source, not the output.

  - id: preset-default-lockfiles-follow-manifests
    kind: require_command
    mode: warn
    when_paths:
      - "package.json"
      - "pyproject.toml"
      - "Cargo.toml"
      - "go.mod"
      - "requirements.txt"
      - "**/package.json"
      - "**/pyproject.toml"
      - "**/Cargo.toml"
      - "**/go.mod"
      - "**/requirements.txt"
    commands:
      - "npm install"
      - "pnpm install"
      - "yarn install"
      - "uv sync"
      - "uv sync --locked"
      - "pip install -r requirements.txt"
      - "cargo build"
      - "cargo update"
      - "go mod tidy"
    message: Regenerate the lockfile after editing a dependency manifest.
