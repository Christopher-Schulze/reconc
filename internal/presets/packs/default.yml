# reconc preset: default
#
# Stack-neutral baseline guardrails. Blocks direct writes to conventional
# generated output without guessing a package manager or build command.

pack:
  format_version: "1"
  name: default
  summary: Stack-neutral generated-output protection.
  stacks: ["*"]
  capabilities:
    - id: generated-output-protection
      inputs: ["generated/**", "dist/**", "build/**"]
      evidence: ["write-path"]
      rules: ["preset-default-generated-read-only"]
  conflicts: []

rules:
  - id: preset-default-generated-read-only
    kind: deny_write
    mode: block
    paths:
      # Top-level output directories.
      #
      # NOTE: dist/** here blocks agent writes to release artifacts.
      # Repos that intentionally build release artifacts through an
      # agent (see the `release` pack's checksum coupling) must not
      # combine that flow with this pack, or must let the build system
      # own dist/ outside agent sessions.
      - "generated/**"
      - "dist/**"
      - "build/**"
      # Nested under any prefix - required for monorepos where each
      # package keeps its own dist/ or generated/ directory. Nested
      # build/ is intentionally not matched because scripts/build/ is
      # commonly source-owned tooling.
      - "**/generated/**"
      - "**/dist/**"
      # Files explicitly flagged as generated regardless of directory.
      - "**/*.generated.*"
    message: Generated artifacts are managed by the build; edit the source, not the output.
