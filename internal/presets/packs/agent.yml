# reconc preset: agent
#
# Stack-neutral defaults for AI-assisted development. Warns on missing project
# context and user-facing documentation without guessing language commands.
# Pair with detected, explicitly selected assurance packs for validation.

pack:
  format_version: "1"
  name: agent
  summary: Stack-neutral AI-agent context and documentation guidance.
  stacks: ["*"]
  capabilities:
    - id: agent-context-read
      inputs: ["source"]
      evidence: ["read-path"]
      rules: ["preset-agent-read-project-context"]
    - id: public-surface-doc-sync
      inputs: ["public-surface"]
      evidence: ["write-path"]
      rules: ["preset-agent-docs-follow-public-surface"]
  conflicts: []

rules:
  - id: preset-agent-read-project-context
    kind: require_read
    mode: warn
    paths:
      - "src/**"
      - "cmd/**"
      - "internal/**"
      - "lib/**"
      - "pkg/**"
      - "app/**"
      - "packages/**"
    before_paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "start.md"
      - "README.md"
      - "docs/architecture.md"
      - "ARCHITECTURE.md"
    message: Read the project context before editing source code.

  - id: preset-agent-docs-follow-public-surface
    kind: couple_change
    mode: warn
    paths:
      - "cmd/**"
      - "src/**/cli/**"
      - "src/**/api/**"
      - "src/**/runtime/**"
      - "internal/cli/**"
      - "internal/hooks/**"
      - "internal/runtime/**"
      - "app/api/**"
    when_paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
    message: Public CLI, API, hook, or runtime changes should update user-facing docs.
