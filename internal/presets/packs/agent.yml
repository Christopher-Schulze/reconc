# reconc preset: agent
#
# Lightweight defaults for AI-assisted development. Warns on missing context,
# validation, and user-facing documentation without hard-locking the normal
# edit loop. Pair with `default` for generated-output protection.

pack:
  format_version: "1"
  name: agent
  summary: Lightweight AI-agent context, verification, and documentation guidance.
  stacks: ["*"]
  capabilities:
    - id: agent-test-evidence
      inputs: ["source", "dependency-manifest"]
      evidence: ["command-success"]
      rules: ["preset-agent-tests-before-done"]
    - id: agent-context-read
      inputs: ["source"]
      evidence: ["read-path"]
      rules: ["preset-agent-read-project-context"]
    - id: public-surface-doc-sync
      inputs: ["public-surface"]
      evidence: ["write-path"]
      rules: ["preset-agent-docs-follow-public-surface"]
    - id: shipped-source-hygiene
      inputs: ["changed shipped source"]
      evidence: ["native-source-scan"]
      rules: ["preset-agent-source-hygiene"]
  conflicts: []

rules:
  - id: preset-agent-tests-before-done
    kind: require_command_success
    mode: warn
    when_paths:
      - "src/**"
      - "cmd/**"
      - "internal/**"
      - "lib/**"
      - "pkg/**"
      - "app/**"
      - "packages/**"
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
      - "package.json"
      - "Cargo.toml"
    commands:
      - "go test ./..."
      - "go test -race ./..."
      - "go test -count=1 ./..."
      - "go test -race -count=1 ./..."
      - "pytest -q"
      - "pytest"
      - "uv run pytest -q"
      - "uv run pytest"
      - "npm test"
      - "pnpm test"
      - "bun test"
      - "bun run test"
      - "cargo test"
    message: Source or dependency changes should be backed by a successful test run.

  - id: preset-agent-read-project-context
    kind: require_read
    mode: warn
    paths:
      - "src/**"
      - "cmd/**"
      - "internal/**"
      - "lib/**"
      - "pkg/**"
      - "app/**"
      - "packages/**"
    before_paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "start.md"
      - "README.md"
      - "docs/architecture.md"
      - "ARCHITECTURE.md"
    message: Read the project context before editing source code.

  - id: preset-agent-docs-follow-public-surface
    kind: couple_change
    mode: warn
    paths:
      - "cmd/**"
      - "src/**/cli/**"
      - "src/**/api/**"
      - "src/**/runtime/**"
      - "internal/cli/**"
      - "internal/hooks/**"
      - "internal/runtime/**"
      - "app/api/**"
    when_paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
    message: Public CLI, API, hook, or runtime changes should update user-facing docs.

  - id: preset-agent-source-hygiene
    kind: require_assurance
    mode: warn
    when_paths:
      - "**/*.go"
      - "**/*.rs"
      - "**/*.py"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.java"
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.cs"
      - "**/*.swift"
    message: Changed shipped source should not contain implementation-debt markers or unimplemented sentinels.
    assurance:
      - id: shipped-source-hygiene
        type: source_hygiene
        scan_paths:
          - "**/*.go"
          - "**/*.rs"
          - "**/*.py"
          - "**/*.js"
          - "**/*.jsx"
          - "**/*.ts"
          - "**/*.tsx"
          - "**/*.java"
          - "**/*.kt"
          - "**/*.kts"
          - "**/*.c"
          - "**/*.cc"
          - "**/*.cpp"
          - "**/*.h"
          - "**/*.hpp"
          - "**/*.cs"
          - "**/*.swift"
        exclude_paths:
          - "**/*_test.go"
          - "**/test_*.py"
          - "**/*_test.py"
          - "**/*.test.*"
          - "**/*.spec.*"
          - "**/test/**"
          - "**/tests/**"
          - "**/__tests__/**"
          - "**/fixtures/**"
          - "vendor/**"
          - "node_modules/**"
          - "target/**"
          - "dist/**"
          - "build/**"
          - "generated/**"
          - "**/generated/**"
          - "**/*.gen.*"
          - "**/*.generated.*"
