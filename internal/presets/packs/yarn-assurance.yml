# reconc preset: yarn-assurance
#
# Explicit opt-in Yarn gates. Detection requires package-manager evidence and
# only recommends this pack; Reconc never installs Node, Corepack, or Yarn.

pack:
  format_version: "1"
  name: yarn-assurance
  summary: Exact dependency pins and current evidence for declared Yarn scripts.
  stacks: ["yarn"]
  capabilities:
    - id: yarn-dependency-pins
      inputs: ["**/package.json"]
      evidence: ["native-manifest-scan"]
      rules: ["preset-yarn-assurance"]
    - id: yarn-declared-scripts
      inputs: ["declared test, lint, build, and typecheck scripts"]
      evidence: ["command-success"]
      rules: ["preset-yarn-assurance"]
  conflicts: []

rules:
  - id: preset-yarn-assurance
    kind: require_assurance
    mode: warn
    when_paths: ["**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}", "**/package.json", "**/yarn.lock"]
    message: Yarn changes require exact dependency pins and current evidence for every declared standard verification script.
    assurance:
      - id: yarn-pins
        type: dependency_pins
        applicable_if: ["yarn.lock", "**/yarn.lock"]
        manifest_paths: ["**/package.json"]
        dependency_sections: ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]
        allowed_version_prefixes: ["workspace:", "portal:", "patch:", "file:", "link:"]
      - id: yarn-declared-scripts
        type: package_scripts
        applicable_if: ["package.json", "**/package.json"]
        manifest_paths: ["**/package.json"]
        exclude_paths: ["testdata/**", "**/testdata/**", "fixtures/**", "**/fixtures/**", "examples/**", "**/examples/**", "__fixtures__/**", "**/__fixtures__/**"]
        package_manager: yarn
        commands: ["yarn run test", "yarn run lint", "yarn run build", "yarn run typecheck"]
